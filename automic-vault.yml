name:
  isotope:aliyun-cli

replaces:
  brew:aliyun-cli

build: |
  git submodule update --init --recursive
  GOTOOLCHAIN=go1.26.9 go test ./config -run 'Test(SplitProcessCommand|Profile_GetCredential_External)'
  CGO_ENABLED=0 GOOS=darwin GOARCH="$(go env GOARCH)" GOTOOLCHAIN=go1.26.9 \
    go build -trimpath \
    -ldflags "-s -w -X 'github.com/aliyun/aliyun-cli/v3/cli.Version=${VERSION}'" \
    -o aliyun ./main
  mkdir -p bin
  cp aliyun bin/aliyun
  codesign --force --options runtime --timestamp \
    --identifier aliyun \
    --sign "$CODESIGN_IDENTITY" \
    bin/aliyun
  tar czf out.tgz bin/aliyun

justification:
  title:
    Unprotected Credential Access
  detail: |
    Alibaba Cloud CLI stores AccessKey and STS credentials in plaintext profile
    configuration. Its official macOS binary also carries runtime exceptions
    that make it ineligible for Secret Application.

    This Isotope preserves the upstream External credential-provider boundary
    while supplying a stable, signed, Hardened Runtime Target with no
    entitlements. The Automic Vault Hardener migrates supported profile
    credentials into custody and leaves only non-secret profile metadata and a
    fixed provider command on disk.
